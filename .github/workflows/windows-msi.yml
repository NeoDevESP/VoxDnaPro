# VOX DNA PRO — compila en Windows (MSVC) y genera el instalador .msi
#  1) windows: compila VST3 + Standalone, pasa las pruebas y pluginval (nivel 10)
#  2) msi:     genera el .msi con installer/make_wxs.py + wixl y lo publica
#              como artefacto y en la rama "builds" (builds/VOX_DNA_PRO_<versión>_x64.msi)
name: Windows MSI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Versión
        id: ver
        shell: bash
        run: echo "version=$(grep -oP 'project\(VOX_DNA_PRO VERSION \K[0-9.]+' CMakeLists.txt)" >> "$GITHUB_OUTPUT"

      - name: Cache JUCE
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-8.0.4-msvc

      - name: Configurar (VS 2022 x64)
        run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DVD_BUILD_TESTS=ON

      - name: Compilar plugin
        run: cmake --build build --config Release --parallel --target VoxDnaPro_VST3 VoxDnaPro_Standalone

      - name: Compilar pruebas
        run: cmake --build build --config Release --parallel --target VoxDnaTests

      - name: Pruebas DSP/UI
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p test-out
          /usr/bin/find build -maxdepth 4 -iname "*.exe" > test-out/exes.txt || true
          ls -R build/VoxDnaTests_artefacts >> test-out/exes.txt 2>&1 || true
          EXE=$(/usr/bin/find build -iname VoxDnaTests.exe | head -1); echo "exe: $EXE" | tee -a test-out/exes.txt
          set +e
          "$EXE" test-out > test-out/test_report_windows.txt 2>&1
          CODE=$?
          set -e
          cat test-out/test_report_windows.txt
          echo "codigo de salida: $CODE" | tee -a test-out/test_report_windows.txt
          exit $CODE

      - name: pluginval (nivel 10)
        id: pval
        continue-on-error: true
        shell: bash
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip
          7z x -y pluginval.zip > /dev/null
          ./pluginval.exe --strictness-level 10 --validate-in-process --timeout-ms 600000 \
            --output-dir test-out "build/VoxDnaPro_artefacts/Release/VST3/VOX DNA PRO.vst3" | tee test-out/pluginval_windows.txt
          grep -q "SUCCESS" test-out/pluginval_windows.txt

      - name: Publicar informes en la rama ci-reports
        if: always()
        shell: bash
        run: |
          rm -rf test-out/frames
          git config user.name "vox-dna-ci"; git config user.email "ci@users.noreply.github.com"
          cp -r test-out "$RUNNER_TEMP/rep"
          git fetch origin ci-reports || true
          if git rev-parse --verify -q origin/ci-reports; then git checkout -f -B ci-reports origin/ci-reports; else git checkout -f --orphan ci-reports; git rm -rf . -q; fi
          rm -rf windows && mkdir windows && cp -r "$RUNNER_TEMP/rep/." windows/
          git add windows && git commit -qm "informes ${GITHUB_SHA::7}" && git push -q origin ci-reports
          git checkout -f ${GITHUB_SHA}

      - name: Resultado de pruebas y pluginval
        shell: bash
        run: |
          test "${{ steps.tests.outcome }}" = "success" || { echo "Pruebas fallidas"; exit 1; }
          test "${{ steps.pval.outcome }}" = "success" || { echo "pluginval fallido"; exit 1; }

      - name: Preparar archivos para el instalador
        shell: bash
        run: |
          mkdir -p stage/vst3 stage/app stage/docs
          cp -r "build/VoxDnaPro_artefacts/Release/VST3/VOX DNA PRO.vst3" stage/vst3/
          cp "build/VoxDnaPro_artefacts/Release/Standalone/VOX DNA PRO.exe" stage/app/
          cp Resources/Fonts/OFL-*.txt stage/docs/
          cp installer/LEEME.txt stage/docs/
          find stage -type f

      - name: Instalar WiX Toolset 5
        shell: bash
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2

      - name: Construir .msi (WiX, asistente en español)
        shell: bash
        run: |
          V=${{ steps.ver.outputs.version }}
          python installer/make_wxs.py stage "$V" VoxDnaPro.wxs
          set +e
          wix build -arch x64 -culture es-ES -ext WixToolset.UI.wixext VoxDnaPro.wxs -o "VOX_DNA_PRO_${V}_x64.msi" > wix.txt 2>&1
          CODE=$?
          set -e
          cat wix.txt
          if [ $CODE -ne 0 ]; then
            git config user.name "vox-dna-ci"; git config user.email "ci@users.noreply.github.com"
            cp wix.txt VoxDnaPro.wxs "$RUNNER_TEMP/"
            git fetch origin ci-reports
            git checkout -f -B ci-reports origin/ci-reports
            mkdir -p wix && cp "$RUNNER_TEMP/wix.txt" "$RUNNER_TEMP/VoxDnaPro.wxs" wix/
            git add wix && git commit -qm "wix log ${GITHUB_SHA::7}" && git push -q origin ci-reports
            exit $CODE
          fi
          ls -la *.msi

      - name: Validación ICE del .msi
        shell: bash
        run: |
          V=${{ steps.ver.outputs.version }}
          set +e
          wix msi validate "VOX_DNA_PRO_${V}_x64.msi" > ice.txt 2>&1
          echo "codigo: $?" >> ice.txt
          cat ice.txt

      - uses: actions/upload-artifact@v4
        with:
          name: VOX_DNA_PRO_${{ steps.ver.outputs.version }}_x64_msi
          path: "*.msi"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: informes-windows
          path: test-out

      - name: Publicar en la rama builds
        shell: bash
        run: |
          V=${{ steps.ver.outputs.version }}
          git config user.name "vox-dna-ci"; git config user.email "ci@users.noreply.github.com"
          mkdir -p "$RUNNER_TEMP/out" && cp *.msi ice.txt "$RUNNER_TEMP/out/"
          git fetch origin builds || true
          if git rev-parse --verify -q origin/builds; then git checkout -f -B builds origin/builds; else git checkout -f --orphan builds; git rm -rf . -q; fi
          mkdir -p builds && cp "$RUNNER_TEMP"/out/* builds/
          git add builds && git commit -qm "MSI ${V} (${GITHUB_SHA::7})" && git push -q origin builds
